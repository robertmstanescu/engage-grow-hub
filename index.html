<!doctype html>
<html lang="en">
  <head>
    <!-- ZOMBIE KILLER — must run before ANY other script/asset so we
         intercept stale service workers and bfcache restores before the
         old bundle has a chance to boot. Order matters: this block is
         intentionally the very first thing in <head>. -->
    <script>
      // 1) Safari Back-Forward cache buster: when a page is restored
      //    from bfcache (event.persisted === true) the JS heap, the
      //    React-Query cache and any in-flight subscriptions are all
      //    frozen-in-time snapshots. Force a fresh load.
      window.onpageshow = function (event) {
        if (event.persisted) {
          window.location.reload();
        }
      };
      // 2) Zombie service-worker killer. Earlier deploys may have
      //    registered a SW that intercepts fetches and serves stale
      //    assets indefinitely (especially on Safari). Unregister all
      //    of them and force ONE hard reload so the user lands on the
      //    fresh bundle. The sessionStorage flag prevents reload loops.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (regs.length === 0) return;
          Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
            if (!sessionStorage.getItem("sw-cleared")) {
              sessionStorage.setItem("sw-cleared", "1");
              window.location.reload();
            }
          });
        });
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Safari hard-cache defeat: prevents the browser from serving a
         stale index.html (and therefore stale JS bundle references)
         from disk after a deploy. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, post-check=0, pre-check=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Font preconnect + parallel stylesheet load. Loading the Google
         Fonts CSS via <link> here (instead of @import inside index.css)
         lets the browser fetch it in parallel with the main bundle,
         improving LCP. The same family list is also @imported in
         src/index.css as a defensive fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:wght@100..900&display=swap" />


    <!--
      ────────────────────────────────────────────────────────────────
      SSR MARKERS — DO NOT REMOVE
      ────────────────────────────────────────────────────────────────
      The Cloudflare Worker (Phase 2) inspects the User-Agent and, for
      bots / social-card scrapers, fetches the `ssr-index` edge function
      which swaps the marker pairs below for fresh database-driven
      values. Real users with JavaScript NEVER see these defaults —
      `usePageMeta` overwrites them within ~50ms.

      Markers (single HTML comments, listed without angle brackets to
      avoid nested-comment parse errors):
        SSR:TITLE
        SSR:DESCRIPTION
        SSR:CANONICAL
        SSR:OG_TAGS
        SSR:JSONLD
        SSR:NOSCRIPT

      The edge function locates each marker and inserts a fully-formed
      tag (or block of tags) immediately after it, replacing whatever
      neutral default tag follows. Defaults are intentionally brand-
      NEUTRAL so that, even if the Worker is disabled or the edge
      function is down, no stale brand copy ships to the wider web.
      ────────────────────────────────────────────────────────────────
    -->
    <!-- SSR:TITLE -->
    <title>Fractional People & Comms Consultancy | The Magic Coffin</title>
    <!-- SSR:DESCRIPTION -->
    <meta name="description" content="Internal comms, employee experience, people ops and fractional HRBP consulting for scale-ups. Fix culture gaps, align teams, make change stick." />
    <!-- SSR:CANONICAL -->
    <link rel="canonical" href="https://themagiccoffin.com/" />

    <!-- SSR:OG_TAGS -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fractional People & Comms Consultancy | The Magic Coffin" />
    <meta property="og:description" content="Internal comms, employee experience, people ops and fractional HRBP consulting for scale-ups. Fix culture gaps, align teams, make change stick." />
    <meta property="og:url" content="https://themagiccoffin.com/" />
    <meta property="og:site_name" content="The Magic Coffin" />
    <meta property="og:image" content="https://themagiccoffin.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Magic Coffin logo with the tagline for Silly Vampires on a plum background" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fractional People & Comms Consultancy | The Magic Coffin" />
    <meta name="twitter:image" content="https://themagiccoffin.com/og-image.jpg" />

    <meta name="twitter:description" content="Internal comms, employee experience, people ops and fractional HRBP consulting for scale-ups. Fix culture gaps, align teams, make change stick." />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Google Search Console verification -->
    <meta name="google-site-verification" content="Ed76s64LhKJWSmgvqWbwgdK_pGpWs9F3S_UpllOp1WE" />

    <!-- SSR:JSONLD -->
  </head>
  <body>
    <div id="root"></div>
    <!-- SSR:NOSCRIPT -->
    <script type="module" src="/src/main.tsx?v=BUILD_HASH"></script>
  </body>
</html>
